schema_version: 1
protocol_version: hqc-formal-v1
target_k: 20
fusion:
  type: complete_list_equal_weight_wrrf
  rrf_constant: 60
  formula: 1/(rrf_constant+one_based_rank)
  sensitivity_constants: [2, 20, 60, 100]
replay:
  batch_size: 1
  schedule: larger_next_unread_wrrf_contribution
  tie_channel: dense
  check_after_every_item: true
  claim: frozen_replay_stopping_depth_not_global_minimum
quality_metrics: [ndcg_at_10, recall_at_20]
access_metrics:
  - dense_depth
  - sparse_depth
  - dense_workload_sum_ratio
  - sparse_workload_sum_ratio
  - dual_depth_improvement_rate
  - sparse_support
  - sparse_exhausted
fixed_top_l: [10, 20, 50, 100, 200, 500, 1000]
statistics:
  bootstrap_resamples: 10000
  randomization_resamples: 10000
  seed: 20260813
  confidence: 0.95
  query_draw_aggregation: mean_draws_within_query
  cross_dataset_aggregation: equal_weight_dataset_macro
  multiplicity: holm_within_primary_comparator_endpoint_family
primary_comparators: [original, bridge_shared]

